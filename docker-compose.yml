services:
  tor-proxy:
    image: dperson/torproxy:latest
    restart: unless-stopped
    environment:
      - LOCATION=IT
      - TZ=Europe/Rome
      - PASSWORD=${TOR_CONTROL_PASSWORD}
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 10 --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip | grep -q '\"IsTor\":true'"]
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 3

  # Servizio di controllo sempre acceso: espone l'API che il back office usa per
  # gestire la coda artisti, lanciare i run e approvare i risultati. I run sono
  # sottoprocessi di questo container, quindi condivide con lo scraping le
  # cartelle di lavoro e la rete verso Tor.
  updater-api:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "dbUpdater.api.app:app", "--host", "0.0.0.0", "--port", "8090"]
    env_file: .env
    environment:
      - UPDATER_DATA_DIR=/data
    ports:
      - "${UPDATER_PORT:-8090}:8090"
    # Nessun depends_on su tor-proxy: Tor è spento di default, e legarci
    # l'avvio significava che un healthcheck fallito (pool di exit italiani
    # esaurito) impediva di partire anche a chi non lo usa. Quando serve, è
    # `wait_for_tor` dentro il run ad aspettare il circuito.
    networks: [internal]
    volumes:
      - ./ArtistiRevisionati:/app/ArtistiRevisionati
      - ./ArtistiSongSent:/app/ArtistiSongSent
      # Stato persistente: db della coda e dello storico run, log ed eventi,
      # checkpoint dei testi. Senza questo volume il checkpoint si perderebbe
      # a ogni ricreazione del container.
      - ./data:/data

  # Vecchio run one-shot da riga di comando. Non parte più con `docker compose up`:
  #   docker compose --profile manual run --rm dbupdater
  dbupdater:
    build: .
    profiles: ["manual"]
    env_file: .env
    environment:
      - UPDATER_DATA_DIR=/data
    # Nessun depends_on su tor-proxy: Tor è spento di default, e legarci
    # l'avvio significava che un healthcheck fallito (pool di exit italiani
    # esaurito) impediva di partire anche a chi non lo usa. Quando serve, è
    # `wait_for_tor` dentro il run ad aspettare il circuito.
    networks: [internal]
    volumes:
      - ./ArtistiRevisionati:/app/ArtistiRevisionati
      - ./ArtistiSongSent:/app/ArtistiSongSent
      - ./data:/data

networks:
  internal:
    driver: bridge
